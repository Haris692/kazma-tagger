<!doctype html><meta charset="utf-8"><title>test</title>
<iframe id="f" style="width:1400px;height:900px;border:0"></iframe>
<pre id="out"></pre>
<script>
var out = [], pass = 0, fail = 0;
function ok(name, cond, extra){
  if(cond){ pass++; out.push("PASS  " + name); }
  else { fail++; out.push("FAIL  " + name + (extra ? "  <<" + extra + ">>" : "")); }
}
function flush(){
  document.getElementById("out").textContent =
    out.join("\n") + "\n\nRESULTAT " + pass + " ok / " + fail + " ko";
  document.title = "T:" + pass + "/" + fail;
}
var f = document.getElementById("f");
/* LE CACHE FAIT PASSER LES TESTS SUR L'ANCIEN FICHIER. Constate le 4 septembre :
   72/72 au vert alors que index.html venait de changer — l'iframe resservait la
   version gardee par le navigateur, et un Ctrl+Maj+R sur la page de test ne la
   rafraichissait pas. Des tests verts sur du code perime sont pires que rouges.
   D'ou le ?v=Date.now() sur chaque src d'iframe : jamais deux fois la meme URL.

   Vider AVANT le chargement : le script de index.html lit localStorage des
   son execution, donc un clear() fait dans f.onload arrive trop tard et la
   session du run precedent contamine le suivant. */
try{ localStorage.removeItem("kazma-tagger-v1"); }catch(e){}
f.onload = function(){
  var w = f.contentWindow, d = f.contentDocument;
  try{ w.localStorage.clear(); }catch(e){}

  function key(k, opt){
    opt = opt || {};
    var ev = new w.KeyboardEvent("keydown", {
      key: k, shiftKey: !!opt.shift, ctrlKey: !!opt.ctrl, bubbles: true, cancelable: true
    });
    d.dispatchEvent(ev);
  }
  function rows(){ return d.querySelectorAll("#tbody tr:not(:has(.emptyrow))").length; }
  function bodyRows(){
    var trs = d.querySelectorAll("#tbody tr");
    var n = 0;
    for(var i=0;i<trs.length;i++) if(!trs[i].querySelector(".emptyrow")) n++;
    return n;
  }
  function setVal(id, v){
    var e = d.getElementById(id);
    e.value = v;
    e.dispatchEvent(new w.Event("input", {bubbles:true}));
  }
  function txt(id){ return (d.getElementById(id).textContent || "").trim(); }

  // --- 1. configuration : noms d'equipes + effectifs
  setVal("cfgHome", "Kazma SC");
  setVal("cfgAway", "Al-Arabi");
  setVal("cfgRosterH", "1 Al-Rashidi\n7 Mubarak\n10 Al-Enezi\n23 Hamad");
  setVal("cfgRosterA", "9 Attaquant X");
  ok("nom equipe applique au bandeau", txt("hdrMatch") === "Kazma SC — Al-Arabi", txt("hdrMatch"));
  ok("bouton equipe A renomme", txt("tHome") === "Kazma SC", txt("tHome"));
  ok("4 joueurs affiches", d.querySelectorAll("#players button:not(.noplayer)").length === 4,
     d.querySelectorAll("#players button:not(.noplayer)").length);

  // --- 2. selection joueur au numero (2 chiffres)
  key("2"); key("3");
  var selNow = d.querySelector("#players button.on:not(.noplayer)");
  ok("numero 23 selectionne le bon joueur", !!selNow && /23/.test(selNow.textContent) && /Hamad/.test(selNow.textContent),
     selNow ? selNow.textContent : "aucun");

  // --- 3. tag clavier : Tir reussi
  key("t");
  ok("1 action apres touche T", bodyRows() === 1, bodyRows());
  ok("dernier tag = Tir reussi #23", /Tir/.test(txt("lastline")) && /réussi/.test(txt("lastline")) && /23/.test(txt("lastline")),
     txt("lastline"));

  // --- 4. Maj+touche = rate
  key("c", {shift:true});
  ok("2 actions", bodyRows() === 2, bodyRows());
  ok("Maj+C = Centre rate", /Centre/.test(txt("lastline")) && /raté/.test(txt("lastline")), txt("lastline"));

  // --- 5. bascule equipe + joueur remis a zero
  key("e");
  ok("bascule vers adversaire", d.getElementById("tAway").className === "on a",
     d.getElementById("tAway").className);
  ok("joueur deselectionne au changement d equipe", !d.querySelector("#players button.on:not(.noplayer)"));
  ok("effectif adverse charge", d.querySelectorAll("#players button:not(.noplayer)").length === 1,
     d.querySelectorAll("#players button:not(.noplayer)").length);
  key("9"); key("b");
  ok("but adverse tague", /But/.test(txt("lastline")) && /Al-Arabi/.test(txt("lastline")), txt("lastline"));

  // --- 6. numero inexistant ne casse rien
  key("5"); key("5");
  ok("numero absent laisse la selection intacte", bodyRows() === 3, bodyRows());

  // --- 7. clic terrain = zone du dernier tag
  var svg = d.querySelector("#pitchwrap svg");
  var r = svg.getBoundingClientRect();
  svg.dispatchEvent(new w.MouseEvent("click", {
    clientX: r.left + r.width*0.25, clientY: r.top + r.height*0.5,
    bubbles:true, cancelable:true
  }));
  ok("zone appliquee au dernier tag", /zone 25\/50/.test(txt("lastline")), txt("lastline"));
  ok("pastille dessinee sur le terrain", d.querySelectorAll("#pitchMarks circle").length === 1,
     d.querySelectorAll("#pitchMarks circle").length);

  // --- 8. bascule reussi/rate
  d.getElementById("btnKo").click();
  ok("But n a pas d issue (bouton sans effet)", !/réussi|raté/.test(txt("lastline")), txt("lastline"));

  // --- 9. annulation
  key("z", {ctrl:true});
  ok("Ctrl+Z retire la derniere action", bodyRows() === 2, bodyRows());

  // --- 10. suppression par la croix
  d.querySelector("#tbody .xbtn").click();
  ok("croix supprime une ligne", bodyRows() === 1, bodyRows());

  // --- 11. horloge / coup d envoi
  ok("horloge a 0:00 sans video", txt("clock") === "0:00", txt("clock"));
  ok("coup d envoi non cale au depart", /non calé/.test(txt("offinfo")), txt("offinfo"));

  // --- 11bis. calage sur un lecteur externe (YouTube / VLC)
  function sync(v){
    var i = d.getElementById("syncTime");
    i.value = v;
    d.getElementById("btnSync").click();
  }
  sync("1:23:45");
  ok("calage h:mm:ss -> horloge video", txt("vidtime") === "chrono 83:45", txt("vidtime"));
  sync("12:34");
  ok("calage mm:ss", txt("vidtime") === "chrono 12:34", txt("vidtime"));
  sync("7");
  ok("nombre seul = des minutes", txt("vidtime") === "chrono 7:00", txt("vidtime"));
  ok("champ vide apres un calage valide", d.getElementById("syncTime").value === "",
     d.getElementById("syncTime").value);
  sync("pas un temps");
  ok("saisie invalide ignoree (horloge inchangee)", txt("vidtime") === "chrono 7:00", txt("vidtime"));
  ok("saisie invalide conservee pour correction",
     d.getElementById("syncTime").value === "pas un temps",
     d.getElementById("syncTime").value);
  d.getElementById("syncTime").value = "";

  // le calage doit se combiner au coup d envoi
  sync("5:00");
  d.getElementById("btnKickoff").click();     // coup d envoi a 5:00 de video
  sync("20:00");
  ok("minute de match = video - coup d envoi", txt("clock") === "15:00", txt("clock"));
  ok("coup d envoi memorise", /5:00/.test(txt("offinfo")), txt("offinfo"));
  sync("2:00");
  ok("avant le coup d envoi = temps negatif", txt("clock") === "-3:00", txt("clock"));

  // --- 12. filtre Kazma seulement
  key("e"); key("t");           // retour Kazma + un tir
  ok("2 actions au total", bodyRows() === 2, bodyRows());
  var chk = d.getElementById("fOnlyHome");
  chk.checked = true; chk.dispatchEvent(new w.Event("change", {bubbles:true}));
  ok("filtre Kazma masque l adversaire", bodyRows() === 2, bodyRows());
  chk.checked = false; chk.dispatchEvent(new w.Event("change", {bubbles:true}));

  // --- 13. exports : on intercepte le Blob
  var captured = null;
  var realCreate = w.URL.createObjectURL;
  w.URL.createObjectURL = function(b){ captured = b; return realCreate.call(w.URL, b); };

  function grab(btnId, cb){
    captured = null;
    d.getElementById(btnId).click();
    if(!captured){
      ok("export " + btnId + " produit un fichier", false, "aucun blob capture");
      flush();
      return;
    }
    var fr = new w.FileReader();
    fr.onload = function(){
      try{ cb(fr.result); }
      catch(e){ ok("suite apres " + btnId, false, e.message); flush(); }
    };
    fr.readAsText(captured);
  }

  grab("btnSaveXml", function(xml){
    ok("XML : balises instance presentes", (xml.match(/<instance>/g)||[]).length === 2,
       (xml.match(/<instance>/g)||[]).length);
    ok("XML : code = nom de l action", /<code>Tir<\/code>/.test(xml));
    ok("XML : groupe Equipe", /<group>Équipe<\/group><text>Kazma SC<\/text>/.test(xml));
    ok("XML : joueur avec numero et nom", /<text>#23 Hamad<\/text>/.test(xml));
    ok("XML : start avant l action (pre-roll)", /<start>0.00<\/start>/.test(xml));
    ok("XML : entete ALL_INSTANCES", /<ALL_INSTANCES>/.test(xml) && /<\/file>/.test(xml));

    grab("btnSaveCsv", function(csv){
      var lines = csv.replace(/^﻿/,"").trim().split("\n");
      ok("CSV : 1 entete + 2 lignes", lines.length === 3, lines.length);
      ok("CSV : colonnes attendues",
         lines[0] === "id,date,competition,equipe_a,equipe_b,periode,temps_video_s,temps_match_s,minute,seconde,equipe,cote,numero,joueur,action,issue,x,y,x_att,y_att,note",
         lines[0]);
      ok("CSV : issue reussi ecrite sans accent", /,reussi,/.test(csv) || /,reussi$/m.test(csv), lines[1]);
      ok("CSV : cote A pour Kazma", /,Kazma SC,A,/.test(csv), lines[1]);

      grab("btnSaveJson", function(js){
        var st = JSON.parse(js);
        ok("JSON : evenements sauvegardes", st.events.length === 2, st.events.length);
        ok("JSON : effectif sauvegarde", st.rosterH.length === 4, st.rosterH.length);
        ok("JSON : actions sauvegardees", st.actions.length === 19, st.actions.length);

        // --- 14. persistance localStorage
        var stored = JSON.parse(w.localStorage.getItem("kazma-tagger-v1"));
        ok("localStorage contient la session", stored && stored.events.length === 2,
           stored ? stored.events.length : "vide");

        // --- 15. nouveau match
        d.getElementById("btnNewMatch").click();
        ok("nouveau match vide les actions", bodyRows() === 0, bodyRows());
        ok("nouveau match garde l effectif", d.querySelectorAll("#players button:not(.noplayer)").length === 4,
           d.querySelectorAll("#players button:not(.noplayer)").length);

        // --- 16. compteur de passes
        function passLine(i){
          return (d.querySelectorAll(".passrow")[i].textContent || "").replace(/\s+/g, " ");
        }
        key("+"); key("+"); key("+"); key("-");
        ok("+ et - comptent les passes", /3 \/ 4/.test(passLine(0)), passLine(0));
        ok("pourcentage de reussite calcule", /75%/.test(passLine(0)), passLine(0));
        ok("passes comptees sur l equipe armee seulement", /0 \/ 0/.test(passLine(1)), passLine(1));
        var enStock = JSON.parse(w.localStorage.getItem("kazma-tagger-v1"));
        ok("les passes sont de vrais evenements horodates",
           enStock.events.filter(function(e){ return e.action === "passe"; }).length === 4,
           enStock.events.length);
        ok("passes masquees du tableau par defaut", bodyRows() === 0, bodyRows());
        d.getElementById("fNoPass").checked = false;
        d.getElementById("fNoPass").dispatchEvent(new w.Event("change", {bubbles:true}));
        ok("decocher affiche les passes", bodyRows() === 4, bodyRows());
        d.getElementById("passgrid").querySelectorAll("button")[2].click();  // ⤺
        ok("le bouton retirer enleve une passe", /3 \/ 3/.test(passLine(0)), passLine(0));

        // --- 17. passages successifs
        key("t");
        var sel = d.getElementById("focusSel");
        sel.value = "tir";
        sel.dispatchEvent(new w.Event("change", {bubbles:true}));
        ok("le passage ne montre que son action",
           d.querySelectorAll("#actions button").length === 1,
           d.querySelectorAll("#actions button").length);
        ok("le tableau suit le passage", bodyRows() === 1, bodyRows());
        ok("rappel du nombre deja tague", /1 tagué/.test(txt("focusinfo")), txt("focusinfo"));
        key("b");
        var apresBut = JSON.parse(w.localStorage.getItem("kazma-tagger-v1"));
        ok("les autres raccourcis restent actifs pendant un passage",
           apresBut.events.some(function(e){ return e.action === "but"; }), "aucun but");
        ok("un but tague hors passage n apparait pas dans le tableau", bodyRows() === 1, bodyRows());
        sel.value = "";
        sel.dispatchEvent(new w.Event("change", {bubbles:true}));
        ok("revenir a toutes les actions restaure la grille",
           d.querySelectorAll("#actions button").length === 19,
           d.querySelectorAll("#actions button").length);

        // --- 17bis. reprendre un tag deja pose
        sel.value = ""; sel.dispatchEvent(new w.Event("change", {bubbles:true}));
        d.getElementById("fNoPass").checked = true;
        d.getElementById("fNoPass").dispatchEvent(new w.Event("change", {bubbles:true}));
        key("c");                                   // Centre = dernier tag
        var trs = d.querySelectorAll("#tbody tr");
        var derniere = trs[0], plusVieille = trs[trs.length - 1];
        ok("par defaut c est le dernier tag qui est vise",
           derniere.className === "sel", derniere.className);
        plusVieille.click();
        ok("cliquer une ligne la reprend",
           d.querySelectorAll("#tbody tr.sel").length === 1 &&
           d.querySelectorAll("#tbody tr")[trs.length-1].className === "sel",
           d.querySelectorAll("#tbody tr.sel").length);
        ok("le bandeau signale la reprise",
           d.getElementById("lastbox").classList.contains("reprise"), "pas de marque");
        ok("le bouton retour au dernier apparait",
           !d.getElementById("btnLastAgain").classList.contains("hide"), "cache");

        // la note doit viser le tag repris, pas le dernier
        var repris = JSON.parse(w.localStorage.getItem("kazma-tagger-v1")).ctx.sel;
        setVal("noteInput", "corrige apres coup");
        var apresNote = JSON.parse(w.localStorage.getItem("kazma-tagger-v1"));
        ok("la note va sur le tag repris",
           apresNote.events.filter(function(e){ return e.id === repris; })[0].note === "corrige apres coup",
           "note posee ailleurs");
        ok("le dernier tag n a pas ete touche",
           (apresNote.events[apresNote.events.length-1].note || "") === "",
           apresNote.events[apresNote.events.length-1].note);

        // le clic terrain doit placer le tag repris
        var svg = d.querySelector("#pitchwrap svg");
        var box = svg.getBoundingClientRect();
        svg.dispatchEvent(new w.MouseEvent("click", {bubbles:true,
          clientX: box.left + box.width*0.25, clientY: box.top + box.height*0.5}));
        var apresClic = JSON.parse(w.localStorage.getItem("kazma-tagger-v1"));
        var cible = apresClic.events.filter(function(e){ return e.id === repris; })[0];
        ok("le clic terrain place le tag repris", cible.x != null && Math.round(cible.x) === 25,
           cible.x);
        ok("le dernier tag reste sans position",
           apresClic.events[apresClic.events.length-1].x == null,
           apresClic.events[apresClic.events.length-1].x);

        // Echap sort de la reprise
        key("Escape");
        ok("Echap revient au dernier tag",
           d.querySelectorAll("#tbody tr")[0].className === "sel" &&
           !d.getElementById("lastbox").classList.contains("reprise"), "toujours en reprise");

        // un nouveau tag reprend la main tout seul
        plusVieille = d.querySelectorAll("#tbody tr");
        plusVieille[plusVieille.length-1].click();
        key("t");
        ok("un nouveau tag redevient la cible",
           d.querySelectorAll("#tbody tr")[0].className === "sel" &&
           !d.getElementById("lastbox").classList.contains("reprise"), "reprise collee");

        // --- 18. la matrice en direct portee par les boutons
        function equipeArmee(){
          return d.getElementById("tHome").classList.contains("on") ? "home" : "away";
        }
        function badge(id){
          var b = d.querySelector('#actions button[data-act="' + id + '"]');
          return b ? b.querySelector(".cnt").textContent : "(bouton absent)";
        }
        function attendu(id){
          /* les tags passent par saveNow(), donc localStorage est a jour ici —
             a la difference de ctx, ecrit par le save() differe : l equipe
             armee se lit donc dans le DOM. */
          var st = JSON.parse(w.localStorage.getItem("kazma-tagger-v1"));
          var t = equipeArmee();
          return st.events.filter(function(e){
            return e.action === id && e.team === t; }).length;
        }
        var nTir = attendu("tir");
        ok("le bouton porte le compte de l equipe armee",
           badge("tir") === (nTir ? String(nTir) : ""), badge("tir") + " au lieu de " + nTir);
        key("t");
        ok("le compte monte avec le tag", badge("tir") === String(nTir + 1), badge("tir"));
        d.getElementById("btnUndo").click();
        ok("et redescend a l annulation",
           badge("tir") === (nTir ? String(nTir) : ""), badge("tir"));
        ok("un zero ne s affiche pas", badge("carton") === "", badge("carton"));

        // le compte est PAR EQUIPE : il doit changer avec l equipe armee
        var avantBascule = badge("tir");
        key("e");
        ok("le compte suit le changement d equipe",
           badge("tir") === (attendu("tir") ? String(attendu("tir")) : ""),
           badge("tir"));
        key("e");
        ok("et revient en rebasculant", badge("tir") === avantBascule, badge("tir"));

        // --- 19. « aucun » : desarmer le joueur sans clavier
        /* DEUX PIEGES ICI, tous deux payes une fois.
           1. Le clic sur un joueur BASCULE : cliquer un joueur deja arme le
              desarme. On part donc d un etat connu — « aucun » — au lieu de
              dependre de ce que les tests precedents ont laisse.
           2. save() est DIFFERE de 250 ms (saveTimer). Relire localStorage juste
              apres un clic rend l etat d AVANT, et le test passait ou echouait
              selon le hasard du minuteur. On verifie donc le DOM, qui est
              rendu synchroniquement. Seul addEvent() appelle saveNow(), c est
              pourquoi le tag lui-meme reste lisible dans localStorage. */
        d.querySelector("#players button.noplayer").click();
        var prem = d.querySelectorAll("#players button:not(.noplayer)")[0];
        prem.click();
        ok("un joueur peut etre arme",
           d.querySelectorAll("#players button:not(.noplayer)")[0].classList.contains("on"));
        d.querySelector("#players button.noplayer").click();
        ok("« aucun » desarme le joueur",
           !d.querySelector("#players button.on:not(.noplayer)") &&
           d.querySelector("#players button.noplayer").classList.contains("on"));
        key("t");
        var sansJ = JSON.parse(w.localStorage.getItem("kazma-tagger-v1")).events.slice(-1)[0];
        ok("le tag suivant part sans joueur", sansJ.num === null, sansJ.num);

        // --- 20. repli du tableau (le bouton n est visible qu en mobile)
        ok("le tableau est deplie par defaut",
           !d.getElementById("pageTag").classList.contains("tableopen"));
        d.getElementById("btnTable").click();
        ok("le bouton ouvre le tableau",
           d.getElementById("pageTag").classList.contains("tableopen"));
        d.getElementById("btnTable").click();
        ok("et le referme",
           !d.getElementById("pageTag").classList.contains("tableopen"));

        // --- 21. migration : une session enregistree avant l ajout de "Passe"
        var vieux = JSON.parse(w.localStorage.getItem("kazma-tagger-v1"));
        vieux.actions = vieux.actions.filter(function(a){ return a.id !== "passe"; });
        w.localStorage.setItem("kazma-tagger-v1", JSON.stringify(vieux));
        var f2 = document.createElement("iframe");
        f2.style.cssText = "width:1200px;height:800px;border:0";
        f2.onload = function(){
          var d2 = f2.contentDocument;
          var opts = [].map.call(d2.getElementById("focusSel").options, function(o){ return o.value; });
          ok("une session ancienne recupere l action Passe",
             opts.indexOf("passe") !== -1, opts.join(","));
          ok("la migration n ajoute pas de doublon",
             opts.filter(function(v){ return v === "passe"; }).length === 1,
             opts.filter(function(v){ return v === "passe"; }).length);
          f2.remove();

          // --- 22. appui long = action ratee (le « Maj » du telephone)
          var av = JSON.parse(w.localStorage.getItem("kazma-tagger-v1")).events.length;
          var btnAct = d.querySelectorAll("#actions button")[1];
          btnAct.dispatchEvent(new w.Event("touchstart", {bubbles:true}));
          setTimeout(function(){
            var S1 = JSON.parse(w.localStorage.getItem("kazma-tagger-v1"));
            ok("l appui long ajoute un tag", S1.events.length === av + 1, S1.events.length - av);
            ok("l appui long tague RATE",
               S1.events[S1.events.length-1].outcome === "ko",
               S1.events[S1.events.length-1].outcome);
            /* le clic qui suit le relachement ne doit PAS taguer une 2e fois */
            btnAct.dispatchEvent(new w.Event("touchend", {bubbles:true}));
            btnAct.click();
            ok("le clic qui suit l appui long est avale",
               JSON.parse(w.localStorage.getItem("kazma-tagger-v1")).events.length === av + 1,
               JSON.parse(w.localStorage.getItem("kazma-tagger-v1")).events.length - av);

            // --- 23. mise en page telephone, mesuree dans une iframe de 390x760
            try{ localStorage.removeItem("kz_pitch_off"); }catch(e){}
            var f3 = document.createElement("iframe");
            f3.style.cssText = "width:390px;height:760px;border:0";
            f3.onload = function(){
              var d3 = f3.contentDocument, w3 = f3.contentWindow;
              function cs(sel, prop){ return w3.getComputedStyle(d3.querySelector(sel))[prop]; }
              ok("telephone : le cadre video disparait", cs(".videowrap","display") === "none");
              ok("telephone : le tableau est replie", cs(".tablewrap","display") === "none");
              ok("telephone : le bouton d ouverture apparait",
                 cs(".tabletoggle","display") !== "none");
              ok("telephone : le terrain est replie",
                 d3.getElementById("pitchcard").classList.contains("collapsed"));
              ok("telephone : l aide ne parle plus de Maj",
                 d3.querySelector("#cardAct h3").textContent.indexOf("appui long") !== -1,
                 d3.querySelector("#cardAct h3").textContent);
              var b0 = d3.querySelector("#actions button").getBoundingClientRect();
              ok("telephone : cible d au moins 44 px", b0.height >= 44 && b0.width >= 44,
                 Math.round(b0.width) + "x" + Math.round(b0.height));

              /* La carte equipe passe SOUS la grille pour la zone du pouce : le
                 rappel de l equipe armee sur la grille devient donc la seule
                 chose qui dit a qui on attribue au moment ou on tague. */
              var titre = d3.querySelector("#cardAct h3").textContent;
              ok("telephone : la grille annonce l equipe armee",
                 titre.indexOf("Kazma") === 0 || titre.indexOf("Al-Arabi") === 0, titre);
              ok("telephone : la grille porte la couleur de l equipe",
                 d3.getElementById("cardAct").classList.contains("armeH") ||
                 d3.getElementById("cardAct").classList.contains("armeA"));
              var yAct = d3.getElementById("cardAct").getBoundingClientRect().top;
              var yEq  = d3.getElementById("cardTeam").getBoundingClientRect().top;
              ok("telephone : la grille est au-dessus de la carte equipe",
                 yAct < yEq, Math.round(yAct) + " vs " + Math.round(yEq));
              var bs = d3.querySelectorAll("#actions button");
              var derB = bs[bs.length-1].getBoundingClientRect();
              var barre = d3.querySelector(".last").getBoundingClientRect();
              ok("telephone : toutes les actions tiennent sans defiler",
                 derB.bottom <= barre.top,
                 "debord de " + Math.round(derB.bottom - barre.top) + " px");
              f3.remove();
              /* on ne laisse pas la session de test derriere nous */
